# Environment for the experiments. The Regora harness (`regora` Python module, `regora-cli`) is private and is not a
# dependency here: only tinygpt/trainer.py and E6 need it. Analysis scripts run without it.
[project]
name = "regora-experiments"
version = "0.0.0"
description = "Pre-registered experiments on paired-seed comparison, run allocation and selection bias in ML training"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.15.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "optuna>=5.0.0",
]

[dependency-groups]
dev = ["black==26.10.1", "pre-commit==4.7.0"]

[tool.uv]
package = false
